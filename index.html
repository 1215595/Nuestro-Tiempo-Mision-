<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6c5ce7">
  <meta name="description" content="Lista compartida de nuestro hogar y nuestra boda — Angel y Elisabet.">
  <meta name="robots" content="index, follow">
  <title>Bienvenidos Angel y Elisabet | Nuestro Hogar y Nuestra Boda</title>
  <style>
    :root {
      --primary: #6c5ce7;
      --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #2d3436;
      --accent: #00b894;
      --danger: #d63031;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 15px; padding-bottom: 80px; }

    header { text-align: center; margin-bottom: 20px; padding: 15px 10px; background: var(--card-bg); border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    header h1 { font-size: 1.3rem; color: var(--primary); line-height: 1.3; }
    header h2 { font-size: 1.1rem; color: #636e72; font-weight: 500; margin-top: 4px; }

    .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .dash-card { background: var(--card-bg); padding: 12px; border-radius: 10px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
    .dash-card span { font-size: 0.75rem; color: #636e72; display: block; }
    .dash-card strong { font-size: 1.1rem; color: var(--primary); }

    .form-container { background: var(--card-bg); padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; }
    .form-container h3 { font-size: 1rem; margin-bottom: 12px; }
    form { display: flex; flex-direction: column; gap: 10px; }
    label { font-size: 0.8rem; color: #636e72; margin-bottom: -5px; }
    input, select { width: 100%; padding: 12px; border: 1px solid #dfe6e9; border-radius: 8px; font-size: 0.95rem; outline: none; }
    input:focus { border-color: var(--primary); }
    button { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 0.95rem; cursor: pointer; }
    
    .filters { display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
    .filter-btn { background: #e0e0e0; border: none; padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; white-space: nowrap; }
    .filter-btn.active { background: var(--primary); color: white; }

    .product-grid { display: flex; flex-direction: column; gap: 12px; }
    .product-card { background: var(--card-bg); border-radius: 10px; padding: 12px; display: flex; gap: 12px; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
    .product-img { width: 70px; height: 70px; object-fit: cover; border-radius: 8px; background: #f0f0f0; }
    .product-info { flex: 1; min-width: 0; }
    .product-info h4 { font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .product-info p { font-size: 0.85rem; color: #636e72; margin: 2px 0; }
    .badge { display: inline-block; font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; background: #eee; margin-top: 3px; }
    
    .actions { display: flex; flex-direction: column; gap: 6px; }
    .btn-action { border: none; padding: 6px 10px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; text-decoration: none; text-align: center; }
    .btn-buy { background: var(--accent); color: white; }
    .btn-delete { background: #ffeaa7; color: var(--danger); }
    .btn-link { background: #74b9ff; color: white; }
    .comprado { opacity: 0.6; text-decoration: line-through; }
    @media (min-width: 768px) {
      body { max-width: 1100px; margin: 0 auto; padding: 30px; }
      .dashboard { grid-template-columns: 1fr 1fr; }
      .product-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .form-container { padding: 20px; }
    }

    @media (max-width: 480px) {
      .product-card { align-items: flex-start; }
      .product-img { width: 62px; height: 62px; }
      .actions { min-width: 76px; }
      .btn-action { padding: 6px 7px; font-size: 0.7rem; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Bienvenidos Angel y Elisabet</h1>
    <h2>Nuestro Hogar y Nuestra Boda</h2>
  </header>

  <section class="dashboard">
    <div class="dash-card">
      <span>Presupuesto Estimado</span>
      <strong id="total-estimado">$0.00</strong>
    </div>
    <div class="dash-card">
      <span>Comprado / Listos</span>
      <strong id="total-comprado">$0.00</strong>
    </div>
  </section>

  <section class="form-container">
    <h3>Agregar o Editar Artículo</h3>
    <form id="app-form">
      <input type="text" id="nombre" placeholder="Nombre del producto" required>
      <input type="number" id="precio" placeholder="Precio ($)" step="0.01" required>
      <select id="categoria">
        <option value="Boda">Boda</option>
        <option value="Habitación">Habitación</option>
        <option value="Sala y Comedor">Sala y Comedor</option>
        <option value="Cocina y Lavandería">Cocina y Lavandería</option>
        <option value="Otros">Otros</option>
      </select>
      <input type="url" id="link" placeholder="Enlace del producto (https://...)">
      
      <label for="imagen-file">Seleccionar foto desde celular:</label>
      <input type="file" id="imagen-file" accept="image/*">

      <button type="submit" id="submit-btn">Guardar en la Lista</button>
      <button type="button" id="cancel-edit" style="display:none;background:#636e72;">Cancelar edición</button>
    </form>
  </section>

  <div class="filters">
    <button class="filter-btn active" onclick="filtrar('todos', this)">Todos</button>
    <button class="filter-btn" onclick="filtrar('Boda', this)">Boda</button>
    <button class="filter-btn" onclick="filtrar('Habitación', this)">Habitación</button>
    <button class="filter-btn" onclick="filtrar('Sala y Comedor', this)">Sala y Comedor</button>
    <button class="filter-btn" onclick="filtrar('Cocina y Lavandería', this)">Cocina y Lavandería</button>
    <button class="filter-btn" onclick="filtrar('Otros', this)">Otros</button>
  </div>

  <section class="product-grid" id="lista-productos"></section>

  <script>
    // Aplicación 100% estática: compatible con GitHub Pages.
    // Los datos se guardan únicamente en el navegador mediante localStorage.

    const datosIniciales = [
      { id: 1, nombre: "Catering y Estaciones de Comida", precio: 95000, categoria: "Boda", link: "", imagen: "https://images.unsplash.com/photo-1555244162-803834f70033?w=200", comprado: false },
      { id: 2, nombre: "Barra de Bebidas", precio: 35000, categoria: "Boda", link: "", imagen: "https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?w=200", comprado: false },
      { id: 3, nombre: "Mobiliario y Decoración", precio: 58000, categoria: "Boda", link: "", imagen: "https://images.unsplash.com/photo-1519225421980-715cb0215aed?w=200", comprado: false },
      { id: 4, nombre: "Fotografía, Música y Bizcocho", precio: 80000, categoria: "Boda", link: "", imagen: "https://images.unsplash.com/photo-1537633552985-df8429e8048b?w=200", comprado: false },
      { id: 5, nombre: "Juego de Habitación Principal", precio: 45000, categoria: "Habitación", link: "", imagen: "https://images.unsplash.com/photo-1540518614846-7ede433c5172?w=200", comprado: false },
      { id: 6, nombre: "Juego de Sala", precio: 35000, categoria: "Sala y Comedor", link: "", imagen: "https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=200", comprado: false },
      { id: 7, nombre: "Comedor", precio: 25000, categoria: "Sala y Comedor", link: "", imagen: "https://images.unsplash.com/photo-1617806118233-18e1de247200?w=200", comprado: false },
      { id: 8, nombre: "Nevera / Refrigerador", precio: 38000, categoria: "Cocina y Lavandería", link: "", imagen: "https://images.unsplash.com/photo-1584992236310-6edddc08acff?w=200", comprado: false },
      { id: 9, nombre: "Lavadora", precio: 28000, categoria: "Cocina y Lavandería", link: "", imagen: "https://images.unsplash.com/photo-1626806787461-102c1bfaaea1?w=200", comprado: false },
      { id: 10, nombre: "Estufa y Extractor", precio: 22000, categoria: "Cocina y Lavandería", link: "", imagen: "https://images.unsplash.com/photo-1556911220-e15b29be8c8f?w=200", comprado: false }
    ];

    const STORAGE_KEY = "hogar_boda_items";
    const PLACEHOLDER = "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
        <rect width="100" height="100" rx="10" fill="#f0f0f0"/>
        <text x="50" y="48" text-anchor="middle" font-family="Arial" font-size="12" fill="#636e72">Sin</text>
        <text x="50" y="64" text-anchor="middle" font-family="Arial" font-size="12" fill="#636e72">imagen</text>
      </svg>
    `);

    let productos;
    try {
      productos = JSON.parse(localStorage.getItem(STORAGE_KEY));
    } catch {
      productos = null;
    }

    if (!Array.isArray(productos) || productos.length === 0) {
      productos = datosIniciales.map(p => ({ ...p }));
      guardar();
    }

    let filtroActual = "todos";
    let editandoId = null;

    const form = document.getElementById("app-form");
    const lista = document.getElementById("lista-productos");
    const submitBtn = document.getElementById("submit-btn");
    const cancelEditBtn = document.getElementById("cancel-edit");

    function escaparHTML(valor) {
      return String(valor ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function esURLSegura(url) {
      if (!url) return false;
      try {
        const u = new URL(url);
        return u.protocol === "http:" || u.protocol === "https:";
      } catch {
        return false;
      }
    }

    function guardar() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(productos));
        return true;
      } catch (e) {
        alert("No se pudo guardar la información en este navegador. Si agregaste una foto, prueba con una imagen más pequeña.");
        return false;
      }
    }

    async function convertirImagenABase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const nombre = document.getElementById("nombre").value.trim();
      const precio = Number.parseFloat(document.getElementById("precio").value);
      const categoria = document.getElementById("categoria").value;
      const link = document.getElementById("link").value.trim();
      const fileInput = document.getElementById("imagen-file");

      if (!nombre || !Number.isFinite(precio) || precio < 0) {
        alert("Completa un nombre y un precio válido.");
        return;
      }

      if (link && !esURLSegura(link)) {
        alert("El enlace debe comenzar con http:// o https://");
        return;
      }

      let imagen = PLACEHOLDER;
      if (fileInput.files && fileInput.files[0]) {
        const file = fileInput.files[0];

        if (!file.type.startsWith("image/")) {
          alert("Selecciona un archivo de imagen válido.");
          return;
        }

        if (file.size > 2 * 1024 * 1024) {
          alert("La foto supera 2 MB. Usa una imagen más pequeña para evitar llenar el almacenamiento del navegador.");
          return;
        }

        imagen = await convertirImagenABase64(file);
      }

      if (editandoId !== null) {
        const anterior = productos.find(p => p.id === editandoId);
        productos = productos.map(p =>
          p.id === editandoId
            ? {
                ...p,
                nombre,
                precio,
                categoria,
                link,
                imagen: fileInput.files?.[0] ? imagen : (anterior?.imagen || PLACEHOLDER)
              }
            : p
        );
      } else {
        productos.push({
          id: Date.now(),
          nombre,
          precio,
          categoria,
          link,
          imagen,
          comprado: false
        });
      }

      if (guardar()) {
        limpiarFormulario();
        renderizar();
      }
    });

    function editarProducto(id) {
      const p = productos.find(item => item.id === id);
      if (!p) return;

      editandoId = id;
      document.getElementById("nombre").value = p.nombre;
      document.getElementById("precio").value = p.precio;
      document.getElementById("categoria").value = p.categoria;
      document.getElementById("link").value = p.link || "";
      document.getElementById("imagen-file").value = "";

      submitBtn.textContent = "Guardar cambios";
      cancelEditBtn.style.display = "block";
      document.querySelector(".form-container").scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function limpiarFormulario() {
      form.reset();
      editandoId = null;
      submitBtn.textContent = "Guardar en la Lista";
      cancelEditBtn.style.display = "none";
    }

    cancelEditBtn.addEventListener("click", limpiarFormulario);

    function toggleComprado(id) {
      productos = productos.map(p =>
        p.id === id ? { ...p, comprado: !p.comprado } : p
      );
      if (guardar()) renderizar();
    }

    function eliminarProducto(id) {
      const p = productos.find(item => item.id === id);
      if (!p) return;

      if (confirm(`¿Eliminar "${p.nombre}" de la lista?`)) {
        productos = productos.filter(item => item.id !== id);
        if (guardar()) renderizar();
      }
    }

    function filtrar(cat, btn) {
      filtroActual = cat;
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderizar();
    }

    function renderizar() {
      lista.innerHTML = "";

      let totalEst = 0;
      let totalComp = 0;

      productos.forEach(p => {
        totalEst += Number(p.precio) || 0;
        if (p.comprado) totalComp += Number(p.precio) || 0;
      });

      document.getElementById("total-estimado").textContent =
        `$${totalEst.toLocaleString("es-DO", { minimumFractionDigits: 2 })}`;

      document.getElementById("total-comprado").textContent =
        `$${totalComp.toLocaleString("es-DO", { minimumFractionDigits: 2 })}`;

      const filtrados = productos.filter(
        p => filtroActual === "todos" || p.categoria === filtroActual
      );

      if (filtrados.length === 0) {
        lista.innerHTML = `
          <div class="form-container" style="text-align:center;color:#636e72;">
            No hay artículos en esta categoría.
          </div>`;
        return;
      }

      filtrados.forEach(p => {
        const card = document.createElement("div");
        card.className = `product-card ${p.comprado ? "comprado" : ""}`;

        const safeImage = p.imagen || PLACEHOLDER;
        const safeLink = esURLSegura(p.link) ? p.link : "";

        card.innerHTML = `
          <img src="${safeImage}" class="product-img" alt="${escaparHTML(p.nombre)}"
               onerror="this.src='${PLACEHOLDER}'">

          <div class="product-info">
            <h4>${escaparHTML(p.nombre)}</h4>
            <p><strong>$${Number(p.precio).toLocaleString("es-DO", { minimumFractionDigits: 2 })}</strong></p>
            <span class="badge">${escaparHTML(p.categoria)}</span>
          </div>

          <div class="actions">
            ${safeLink
              ? `<a href="${escaparHTML(safeLink)}" target="_blank" rel="noopener noreferrer" class="btn-action btn-link">Ver</a>`
              : ""}
            <button onclick="editarProducto(${p.id})" class="btn-action" style="background:#a29bfe;color:white;">Editar</button>
            <button onclick="toggleComprado(${p.id})" class="btn-action btn-buy">
              ${p.comprado ? "Desmarcar" : "Comprado"}
            </button>
            <button onclick="eliminarProducto(${p.id})" class="btn-action btn-delete">✕</button>
          </div>
        `;

        lista.appendChild(card);
      });
    }

    renderizar();
  </script>
  <noscript>
    <div style="max-width:700px;margin:20px auto;padding:15px;background:#fff3cd;border-radius:10px;text-align:center;">
      Esta página necesita JavaScript activado para administrar la lista.
    </div>
  </noscript>
</body>
</html>
